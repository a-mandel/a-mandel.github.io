<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palimpsest</title>
<meta name="description" content="ANDRÉ MANDEL logo motion study S01, Palimpsest. Territory: time and decay.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbfaf7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<style>
:root{--ink:#1b1a18;--muted:#6c6963;--faint:#a19e97;--page:#fbfaf7;--paper:#f6f3ec;--accent:#c4571f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Garamond,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;align-items:center;padding:16px}
#stage{position:relative;background:var(--paper);box-shadow:0 1px 2px rgba(27,26,24,.06),0 18px 46px rgba(27,26,24,.11);overflow:hidden}
#stage canvas,#stage img.fb{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage img.fb{object-fit:contain;padding:6% 7% 9% 9%}
.cap{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:18px}
.cap .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.cap .h{font-family:'Tenor Sans','Gill Sans',Optima,sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:10.5px;color:var(--ink);display:flex;gap:12px;align-items:baseline}
.cap .h .n{color:var(--muted)}
.cap .h .d{color:var(--faint);letter-spacing:.12em;font-variant-numeric:tabular-nums;min-width:6.5em}
.cap .h .d:empty{display:none}
.cap i{font-size:15px;line-height:1.3;color:var(--muted)}
.ctl{display:flex;gap:8px;flex:none}
.pill{font-family:'Tenor Sans','Gill Sans',Optima,sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:10px;line-height:1;padding:8px 14px 7px;border:1px solid rgba(27,26,24,.32);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:var(--page)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--page)}
</style>
</head>
<body>
<main>
  <div id="stage" role="img" aria-label="The ANDRÉ MANDEL lockup surfacing from beneath layers of older erased drawings"><canvas id="cv"></canvas></div>
  <div class="cap" id="cap">
    <div class="t">
      <div class="h"><span class="n">S01</span><span>Palimpsest</span><span class="d" id="date"></span></div>
      <i>A rubbing finds the mark pressed under years of graphite; the eraser clears, and the ink rises from beneath.</i>
    </div>
    <div class="ctl"><button class="pill" id="replay" type="button">Replay</button></div>
  </div>
</main>
<script>
/* s01 Palimpsest: older drawings live on the sheet; a pencil rubbing finds the mark pressed into the paper, the eraser
   clears the field, and the ink comes up from beneath. Eight graphite layers are drawn once into two textures. */
window.STUDY = {
  dur: 14.2, tail: 0,
  textures: async ({ WIN, loadImg, MARKS }) => {
    const PPI = 300, CW = Math.round(WIN.w * PPI), CH = Math.round(WIN.h * PPI);
    const [m05, mT14, m01, m12, mT03] = await Promise.all(['lock05', 'lockT14', 'mark01', 'lock12', 'lockT03'].map(n => loadImg(MARKS + n + '.webp')));
    let sd = 7;
    const rnd = () => (sd = (Math.imul(sd, 1664525) + 1013904223) >>> 0) / 4294967296;
    const J = (a) => (rnd() - .5) * 2 * a;
    const mk = () => { const c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d', { willReadFrequently: true });
      x.fillStyle = '#000'; x.fillRect(0, 0, CW, CH); x.setTransform(PPI, 0, 0, PPI, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round'; return [c, x]; };
    const W = (a) => `rgba(255,255,255,${a})`;
    // a pencil line: two slightly different passes, a touch of wobble, tapering pressure
    function pencil(x, pts, w, a, wob = .006) {
      for (let pass = 0; pass < 2; pass++) {
        x.strokeStyle = W(a * (pass ? .55 : 1)); x.lineWidth = w * (pass ? .7 : 1); x.beginPath();
        pts.forEach((p, i) => { const q = [p[0] + J(wob), p[1] + J(wob)]; i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); });
        x.stroke();
      }
    }
    function line(x, x1, y1, x2, y2, w, a, over = .06) {
      const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, n = Math.max(2, Math.ceil(l / .25));
      const pts = []; for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x1 - ux * over + (dx + 2 * ux * over) * t, y1 - uy * over + (dy + 2 * uy * over) * t]); }
      pencil(x, pts, w, a, .003);
    }
    function arc(x, cx, cy, r, a0, a1, w, a) { const pts = [], n = Math.ceil(Math.abs(a1 - a0) * r / .05) + 2;
      for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n, rr = r * (1 + J(.004)); pts.push([cx + Math.cos(t) * rr, cy + Math.sin(t) * rr]); } pencil(x, pts, w, a, .002); }
    function hatchPat(x, ang, gap, w, a) { const c = document.createElement('canvas'), s = 64; c.width = c.height = s; const h = c.getContext('2d');
      h.strokeStyle = W(a); h.lineWidth = w; for (let k = -s; k < 2 * s; k += gap) { h.beginPath(); h.moveTo(k, 0); h.lineTo(k + s, s); h.stroke(); }
      const p = x.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().rotate(ang).scale(1 / PPI)); return p; }
    // an older version of the mark, drawn in graphite: a hatched fill and a soft contour
    function oldMark(x, img, cx, cy, wIn, ang, hAng, fillA, edgeA) {
      const hIn = wIn * img.height / img.width, t = document.createElement('canvas'); t.width = CW; t.height = CH;
      const tx = t.getContext('2d'); tx.setTransform(PPI, 0, 0, PPI, 0, 0); tx.translate(cx, cy); tx.rotate(ang * Math.PI / 180);
      tx.drawImage(img, -wIn / 2, -hIn / 2, wIn, hIn); tx.setTransform(1, 0, 0, 1, 0, 0);
      tx.globalCompositeOperation = 'source-in'; tx.fillStyle = '#fff'; tx.fillRect(0, 0, CW, CH);
      const e = document.createElement('canvas'); e.width = CW; e.height = CH; const ex = e.getContext('2d');
      ex.filter = 'blur(1.4px)'; ex.drawImage(t, 0, 0); ex.filter = 'none';
      ex.globalCompositeOperation = 'destination-out'; ex.filter = 'blur(.4px)'; ex.drawImage(t, 2.2, 2.2); ex.drawImage(t, -2.2, -2.2); ex.filter = 'none';
      const f = document.createElement('canvas'); f.width = CW; f.height = CH; const fx = f.getContext('2d');
      fx.fillStyle = hatchPat(fx, hAng, 7, 1.4, 1); fx.fillRect(0, 0, CW, CH);
      fx.globalCompositeOperation = 'destination-in'; fx.drawImage(t, 0, 0);
      x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
      x.globalAlpha = fillA; x.drawImage(f, 0, 0); x.globalAlpha = edgeA; x.drawImage(e, 0, 0); x.globalAlpha = 1; x.restore();
    }
    function hand(x, s, px, py, size, a, ang = 0) {
      x.save(); x.translate(px, py); x.rotate(ang); x.fillStyle = W(a);
      x.font = `${size}px "Nothing You Could Do", "Bradley Hand", "Segoe Print", cursive`; x.fillText(s, 0, 0); x.restore();
    }
    function smudge(x, cx, cy, rx, ry, a, ang = 0) {
      x.save(); x.translate(cx, cy); x.rotate(ang); x.scale(1, ry / rx);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, W(a)); g.addColorStop(.6, W(a * .4)); g.addColorStop(1, W(0));
      x.fillStyle = g; x.fillRect(-rx, -rx, 2 * rx, 2 * rx); x.restore();
    }
    const L = [];
    // 0 the oldest: a first version of the mark, larger and leaning, and the land under the house
    { const [c, x] = mk();
      oldMark(x, m05, 1.62, 2.55, 2.9, -7, 38, .55, .85);
      for (let k = 0; k < 13; k++) { const pts = [], r0 = .25 + k * .16;
        for (let i = 0; i <= 90; i++) { const t = i / 90 * Math.PI * 2, wob = Math.sin(t * 3 + k * .7) * .06 + Math.sin(t * 5 - k) * .03;
          pts.push([2.95 + Math.cos(t) * (r0 + wob) * 1.25, 4.9 + Math.sin(t) * (r0 + wob) * .62]); }
        pencil(x, pts, .006, .5 - k * .02, .002); }
      L.push(c); }
    // 1 construction: the roof stroke angle, compass arcs, a regulating diagonal, the sidebar axis and the inch
    { const [c, x] = mk(); const K = Math.atan(1 / .738);
      line(x, .35, .25, .35 + Math.cos(K) * 6, .25 + Math.sin(K) * 6, .005, .9);
      line(x, .1, 2.89, 3.4, 2.89, .004, .8); line(x, 1.75, .05, 1.75, 5.2, .004, .7); line(x, .12, 4.33, 3.38, 4.33, .004, .8);
      line(x, .12, 4.02, 3.38, 4.02, .0035, .6);
      arc(x, .56, 4.33, 3.75, -1.45, -.1, .005, .75); arc(x, .56, 4.33, 2.32, -1.6, .02, .004, .55); arc(x, 3.0, .64, 1.9, 1.6, 3.2, .004, .5);
      [[.56, 4.33], [3.0, .64], [1.75, 2.89]].forEach(([a, b]) => { line(x, a - .07, b, a + .07, b, .004, .9, 0); line(x, a, b - .07, a, b + .07, .004, .9, 0); });
      // a dimension string across the top
      line(x, .46, .34, 3.02, .34, .0035, .8); [.46, 1.27, 3.02].forEach(a => line(x, a - .03, .37, a + .03, .31, .005, .9, 0));
      hand(x, '2 9/16', 1.55, .29, .13, .85); hand(x, '53.6°', 1.2, 1.58, .12, .8, .93);
      L.push(c); }
    // 2 the newest sketch: a heavy gestural A over to the right, and notes to self
    { const [c, x] = mk();
      oldMark(x, mT14, 2.05, 2.25, 2.35, 4, -52, .4, 1);
      hand(x, 'lift the tip', 2.12, .5, .15, .95, -.08); hand(x, 'fold', .32, 3.28, .15, .9, -.04);
      hand(x, 'slower here', 1.95, 3.6, .13, .85, .05);
      pencil(x, [[2.05, .56], [2.42, .74], [2.62, 1.02]], .006, .9); pencil(x, [[2.55, .94], [2.62, 1.02], [2.6, .9]], .006, .9);
      L.push(c); }
    // 3 lettering trials: the name larger and letterspaced, guidelines, a monogram
    { const [c, x] = mk();
      line(x, .1, 4.9, 3.4, 4.9, .003, .7); line(x, .1, 4.62, 3.4, 4.62, .003, .7);
      x.fillStyle = W(.85); x.font = '0.34px "EB Garamond", Garamond, serif'; x.letterSpacing = '0.09px'; x.fillText('MANDEL', .34, 4.9);
      x.letterSpacing = '0px'; x.font = 'italic 0.3px "EB Garamond", Garamond, serif'; x.globalAlpha = .7; x.fillText('André', .55, 3.75); x.globalAlpha = 1;
      x.font = '0.55px "EB Garamond", Garamond, serif'; x.fillStyle = W(.55); x.fillText('A', 2.7, 5.2); x.fillText('M', 2.98, 5.2);
      L.push(c); }
    // 4 the ribbon roof in section: the fold beam, joists square to it, the lifted tip
    { const [c, x] = mk(); const ox = .25, oy = 1.85;
      pencil(x, [[ox, oy + .9], [ox + 1.3, oy + .55], [ox + 2.9, oy - .35]], .007, .85);
      pencil(x, [[ox, oy + 1.02], [ox + 1.3, oy + .67], [ox + 2.95, oy - .24]], .005, .7);
      for (let k = 0; k < 14; k++) { const t = k / 13, px = ox + .1 + t * 2.7, py = oy + .88 - t * 1.1 + (t > .45 ? -(t - .45) * .25 : 0);
        line(x, px, py, px + .07, py + .13, .004, .65, 0); }
      line(x, ox + 1.3, oy + .55, ox + 1.3, oy + 2.1, .004, .6); hand(x, '28.7\'', ox + 2.55, oy - .5, .12, .8);
      L.push(c); }
    // 5 hatch tests and a thumb of graphite where a hand rested
    { const [c, x] = mk();
      x.fillStyle = hatchPat(x, 28, 9, 1.3, .8); x.beginPath(); x.moveTo(.2, 1.05); x.lineTo(.62, .82); x.lineTo(.62, 1.3); x.closePath(); x.fill();
      pencil(x, [[.2, 1.05], [.62, .82], [.62, 1.3], [.2, 1.05]], .004, .8);
      smudge(x, 3.05, 4.55, .55, .22, .45, -.4); smudge(x, .6, 2.2, .7, .3, .22, .7); smudge(x, 2.4, 1.1, .4, .16, .2, -.9);
      for (let k = 0; k < 9; k++) { const y0 = 5.0 + k * .025; pencil(x, [[2.1, y0], [2.5, y0 - .04], [2.9, y0 + .01]], .004, .4); }
      L.push(c); }
    // 6 trials in the margin: three small marks in bubbles, a fourth crossed out
    { const [c, x] = mk();
      [[m01, .55, .6], [m12, 1.0, .58], [mT03, 1.45, .6]].forEach(([im, a, b], i) => { oldMark(x, im, a, b + 4.45, .3, J(4), 45 + i * 30, .9, 1); arc(x, a, b + 4.47, .25, 0, 6.29, .004, .8); });
      L.push(c); }
    // 7 handling: soft graphite haze that a sleeve drags across a sheet over months
    { const [c, x] = mk();
      for (let k = 0; k < 16; k++) smudge(x, rnd() * 3.5, rnd() * 5.25, .3 + rnd() * .9, .1 + rnd() * .3, .1 + rnd() * .12, rnd() * 3);
      L.push(c); }
    // pack eight layers into two textures, one per channel
    const N = CW * CH, A = new Uint8ClampedArray(N * 4), B = new Uint8ClampedArray(N * 4);
    L.forEach((c, i) => { const d = c.getContext('2d').getImageData(0, 0, CW, CH).data, T = i < 4 ? A : B, ch = i % 4;
      for (let p = 0; p < N; p++) T[p * 4 + ch] = d[p * 4]; });
    return [{ name: 'uLA', w: CW, h: CH, data: new ImageData(A, CW, CH), mip: true }, { name: 'uLB', w: CW, h: CH, data: new ImageData(B, CW, CH), mip: true }];
  },
  frag: `
uniform sampler2D uLA; uniform sampler2D uLB;
const float RUB0 = .6, RUB1 = 4.6, INK0 = 9.6, INK1 = 12.9;
const vec4 SA = vec4(.55, .62, .85, .5), SB = vec4(.5, .6, .52, .6);
const vec4 GA = vec4(.12, .12, .14, .07), GB = vec4(.08, .12, .1, .06);
/* eraser swaths: center (sheet in), angle, half length, half width; start, duration, strength */
const int NS = 11;
const vec4 SW[NS] = vec4[NS](
  vec4(33.18, 1.30, 1.02, .78), vec4(33.62, 1.95, 1.0, .9), vec4(34.15, 2.62, .9, .95), vec4(34.62, 3.30, .82, .8),
  vec4(33.05, 2.95, 1.57, .62), vec4(33.55, 2.78, .1, .45), vec4(33.95, 4.30, 0., 1.05), vec4(34.0, 4.18, .04, 1.1),
  vec4(34.95, 3.75, .7, .45), vec4(33.3, .75, -.2, .45), vec4(34.1, 3.6, .6, .7));
const vec4 SW2[NS] = vec4[NS](
  vec4(.27, 4.6, .95, 1.), vec4(.26, 5.2, .95, 1.), vec4(.27, 5.8, .9, 1.), vec4(.25, 6.4, .9, 1.),
  vec4(.22, 6.9, .8, .95), vec4(.2, 7.3, .7, .9), vec4(.22, 7.6, 1.0, 1.), vec4(.14, 8.3, .8, .9),
  vec4(.2, 8.6, .7, .8), vec4(.18, 8.9, .6, .7), vec4(.5, 9.1, 1.1, .45));
float swath(vec2 s, float t, int i){
  vec4 a = SW[i], b = SW2[i];
  float k = win(t, b.y, b.y + b.z); if (k <= 0.) return 0.;
  vec2 u = vec2(cos(a.z), sin(a.z)), q = s - a.xy;
  float x = dot(q, u), y = dot(q, vec2(-u.y, u.x));
  float hl = a.w, hw = b.x;
  float rag = (gn(vec2(x * 9., float(i) * 3.1)) - .5) * .06 + (gn(vec2(x * 40., float(i))) - .5) * .015;
  float side = smoothstep(hw + .02, hw - .03, abs(y + rag));
  float fr = mix(-hl - .2, hl + .1, ease(k));
  float ends = smoothstep(hl + .02, hl - .12, abs(x)) * smoothstep(fr + .06, fr - .06, x * (mod(float(i), 2.) * 2. - 1.));
  float streak = gn(vec2(x * 6., y * 70.) + float(i) * 7.);
  return side * ends * b.w * (1. - .28 * smoothstep(.5, .9, streak));
}
void main(){
  vec2 s = sheetP(), st = s - WIN.xy, uv = st / WIN.zw;
  float t = uT;
  vec3 c = paperB(s);
  float d = dMark(s);
  vec2 gd = gMark(s, .004);
  float to = toothB(s);
  // the mark was pressed in first, hard: a shallow groove that later graphite skips over
  float groove = smoothstep(.005, -.004, d);
  float lip = exp(-max(d, 0.) / .006) * step(0., d);
  float E = 0.;
  for (int i = 0; i < NS; i++) E = 1. - (1. - E) * (1. - swath(s, t, i));
  // then broad passes back and forth across the whole rubbing, each leaving a little graphite behind
  vec2 eu = normalize(vec2(1., -.3)), en = vec2(-eu.y, eu.x);
  float ea = dot(s - vec2(34.05, 2.6), eu), eb = dot(s - vec2(34.05, 2.6), en);
  for (int i = 0; i < 12; i++) {
    float fi = float(i);
    vec2 r = h22(vec2(fi, 3.));
    float yb = -2.25 + fi * .41 + (r.x - .5) * .1;
    float st0 = 7.25 + fi * .19 + r.y * .12;
    float k = win(t, st0, st0 + .55);
    if (k <= 0.) continue;
    float hl = sqrt(max(0., 1. - pow(yb / 2.5, 2.))) * 2.05 + .1;
    float dir = mod(fi, 2.) * 2. - 1.;
    float head = mix(-hl, hl, ease(k));
    float rag = (gn(vec2(ea * 6., fi * 5.)) - .5) * .08;
    float across = smoothstep(.29, .2, abs(eb - yb + rag));
    float along = smoothstep(hl + .05, hl - .2, abs(ea)) * smoothstep(head + .06, head - .06, ea * dir);
    float strk = gn(vec2(ea * 3., eb * 60.) + fi * 7.);
    E = 1. - (1. - E) * (1. - across * along * (.86 - .2 * smoothstep(.5, .9, strk)));
  }
  // the older drawings
  vec4 la = texture(uLA, uv), lb = texture(uLB, uv);
  vec4 skip = vec4(1. - .3 * groove);
  vec4 da = la * SA * mix(vec4(1.), GA / SA, E) * skip, db = lb * SB * mix(vec4(1.), GB / SB, E) * skip;
  float tone = 1.;
  tone *= 1. - .62 * da.x; tone *= 1. - .62 * da.y; tone *= 1. - .62 * db.x; tone *= 1. - .62 * db.y;
  tone *= 1. - .62 * da.w; tone *= 1. - .62 * db.z; tone *= 1. - .62 * db.w; tone *= 1. - .66 * da.z;
  // the rubbing: the side of a soft lead in parallel strokes, band after band, down across the mark
  vec2 ru = normalize(vec2(1., -.36)), rn = vec2(-ru.y, ru.x);
  float ra = dot(s - vec2(34.05, 2.6), ru), rb = dot(s - vec2(34.05, 2.6), rn);
  float bw = .085, rub = 0.;
  for (int j = -1; j <= 1; j++) {
    float bi = floor(rb / bw) + float(j);
    vec2 r = h22(vec2(bi, 17.));
    float yb = (bi + .5) * bw + (r.y - .5) * .02;
    float across = smoothstep(bw * 1.05, bw * .3, abs(rb - yb));
    float ext = sqrt(max(0., 1. - pow(yb / 2.15, 2.))) * 1.72;
    float a0 = -ext - .1 - r.x * .3, a1 = ext + .1 + r.y * .32;
    float start = mix(RUB0, RUB1 - .7, clamp((yb + 2.1) / 4.2, 0., 1.)) + (r.x - .5) * .25;
    float k = win(t, start, start + .6 + .2 * r.y);
    float head = mix(a0, a1, ease(k));
    float feather = (gn(vec2(rb * 30., bi)) - .5) * .35;
    float along = smoothstep(a0 - .05 + feather, a0 + .3 + feather, ra) * smoothstep(head + .04, head - .2, ra)
                * smoothstep(a1 + .05 - feather, a1 - .35 - feather, ra);
    float dens = .3 + .14 * r.x;
    rub = max(rub, across * along * dens);
  }
  float strk = gn(vec2(ra * 7., rb * 190.)) * .55 + gn(vec2(ra * 3., rb * 420.) + 9.) * .45;
  float grain = smoothstep(.28, .78, to * .7 + strk * .5);
  float rubD = rub * (.35 + .9 * grain) * (.85 + .3 * fbm3(s * 4.));
  rubD *= (1. - .94 * groove) * (1. + .7 * lip);
  rubD *= 1. - .94 * E;
  tone *= 1. - .62 * clamp(rubD, 0., 1.);
  // the paper where the eraser worked: cleaner, the tooth raised, a faint scuff
  c = mix(c, c * 1.012 + .005, E);
  c *= 1. - E * (to - .5) * .05;
  vec3 gph = vec3(.29, .29, .31);
  c = mix(gph, c, tone) * mix(1., tone, .15);
  // eraser crumbs riding along, then brushed away
  vec2 cg2 = s * 30.; vec2 ci = floor(cg2), cr = h22(ci);
  float crumbOn = step(.8, h12(ci + 3.)) * smoothstep(.1, .5, E) * (1. - win(t, 10.0, 11.0));

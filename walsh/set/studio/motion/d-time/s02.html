<style>
:root{--ink:#1b1a18;--muted:#6c6963;--faint:#a19e97;--page:#fbfaf7;--paper:#f6f3ec;--accent:#c4571f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Garamond,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;align-items:center;padding:16px}
#stage{position:relative;background:var(--paper);box-shadow:0 1px 2px rgba(27,26,24,.06),0 18px 46px rgba(27,26,24,.11);overflow:hidden}
#stage canvas,#stage img.fb{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage img.fb{object-fit:contain;padding:6% 7% 9% 9%}
.cap{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:18px}
.cap .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.cap .h{font-family:'Tenor Sans','Gill Sans',Optima,sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:10.5px;color:var(--ink);display:flex;gap:12px;align-items:baseline}
.cap .h .n{color:var(--muted)}
.cap .h .d{color:var(--faint);letter-spacing:.12em;font-variant-numeric:tabular-nums;min-width:6.5em}
.cap .h .d:empty{display:none}
.cap i{font-size:15px;line-height:1.3;color:var(--muted)}
.ctl{display:flex;gap:8px;flex:none}
.pill{font-family:'Tenor Sans','Gill Sans',Optima,sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:10px;line-height:1;padding:8px 14px 7px;border:1px solid rgba(27,26,24,.32);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:var(--page)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--page)}

<body>
<main>
  <div id="stage" role="img" aria-label="Layers of old paint flaking off a plaster wall to reveal the ANDRÉ MANDEL lockup"><canvas id="cv"></canvas></div>
  <div class="cap" id="cap">
    <div class="t">
      <div class="h"><span class="n">S02</span><span>Old Paint</span><span class="d" id="date"></span></div>
      <i>Bone, oxblood, turquoise, ochre and cobalt flake away, coat by coat, until the mark beneath is bare.</i>
    </div>
    <div class="ctl"><button class="pill" id="replay" type="button">Replay</button></div>
  </div>
</main>
<script>
/* s02 Old Paint: the sidebar has been painted over five times. The coats crack and flake, newest first, and where an
   older coat lets go it takes every newer coat with it. The flaking starts on the mark, whose ink never held paint well,
   and stops in terraces around it: bone, oxblood, turquoise, ochre and cobalt, oldest closest.
   Each coat's flakes are baked once (when it lets go, its crack lines, its random); a frame only compares a clock. */
const COATS = `
const float SC[5] = float[5](30., 22., 17., 13., 10.5);           // flakes per inch
const float RCH[5] = float[5](.05, .12, .21, .31, .43);             // final reach of each coat's clearing, inches
float G_(vec2 c, int k){
  float fk = float(k), dm = max(dMark(c), -.02);
  float isl = fbm3(c * 1.15 + fk * 3.7 + 1.3) - .5, fine = fbm3(c * 4.5 + fk * 9.1) - .5;
  float isl2 = fbm3(c * 2.3 + fk * 5.3 + 7.) - .5;
  float Gm = dm * (.8 + .4 * fbm3(c * .8 + fk)) - isl * (.25 + .6 * RCH[k]) - isl2 * .12 - fine * .1;
  // the wall lets go in patches of its own, terraced through the coats (one shared field, so the coats nest)
  float n = fbm(c * 1.25 + 2.) + (fbm3(c * 3.4 + fk * 6.) - .5) * .12;
  const float A[5] = float[5](1.2, .73, .68, .63, .585);
  float Gp = (A[k] - n) * 1.35 + RCH[k] + max(dm - .7, 0.) * .22;
  return min(Gm, Gp);
}
/* one coat at s: x = when it lets go (as a reach), y = distance to its crack, z = the flake's random */
vec3 coatF(vec2 s, int k){
  float fk = float(k);
  vec2 w = vec2(fbm3(s * 3. + fk * 11.), fbm3(s * 3. + 40. + fk * 7.)) - .5;
  vec2 p = s * SC[k] + w * 1.7;
  vec2 ip = floor(p), fp = fract(p);
  float d1 = 9., d2 = 9.; vec2 b1 = vec2(0.), o1 = vec2(0.);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)), o = h22(ip + g + fk * 17.3);
    vec2 r = g + o - fp; float dd = dot(r, r);
    if (dd < d1) { d2 = d1; d1 = dd; b1 = ip + g; o1 = r; } else if (dd < d2) d2 = dd;
  }
  float edge = (sqrt(d2) - sqrt(d1)) * .5 / SC[k];
  vec2 cen = s + o1 / SC[k];
  float r = h12(b1 + fk * 5.1), r2 = h12(b1 * 1.7 + 9. + fk);
  float onMark = smoothstep(.01, -.01, dMark(cen));
  float G = G_(cen, k) + (r - .5) * .1 - onMark * (.1 + .18 * r2);
  if (k == 0 && onMark > .5 && r2 > .975) G = 9.;
  G += (gn(s * 95. + fk * 13.) - .5) * .018;                     // chips bite through a flake, not only along cracks                   // a few stubborn flecks of the oldest coats stay on the ink
  return vec3(G, edge, r);
}
`;
window.STUDY = {
  dur: 13.5, tail: 0,
  bakeCommon: COATS,
  bake: [
    { name: 'uG', ppi: 300, frag: 'void main(){ vec2 s = sheetP(); fragColor = vec4(coatF(s,0).x, coatF(s,1).x, coatF(s,2).x, coatF(s,3).x); }' },
    { name: 'uE', ppi: 300, frag: 'void main(){ vec2 s = sheetP(); fragColor = vec4(coatF(s,0).y, coatF(s,1).y, coatF(s,2).y, coatF(s,3).y); }' },
    { name: 'uR', ppi: 300, frag: 'void main(){ vec2 s = sheetP(); fragColor = vec4(coatF(s,0).z, coatF(s,1).z, coatF(s,2).z, coatF(s,3).z); }' },
    { name: 'uP', ppi: 300, frag: `void main(){ vec2 s = sheetP();
        float e = .0025;
        #define HH(q) (fbm3((q) * 5.) * .7 + gn((q) * 38.) * .22 + gn((q) * 120.) * .08)
        float h = HH(s), hx = HH(s + vec2(e, 0.)), hy = HH(s + vec2(0., e));
        vec2 g = vec2(hx - h, hy - h) / e;
        float sh = dot(g, normalize(vec2(-.6, -.8))) * .012;
        fragColor = vec4(sh, fbm3(s * 2.1 + 3.), fbm3(s * .7 + 5.), gn(vec2(s.x * 34., s.y * 1.4)) * gn(vec2(s.x * 9. + 3., s.y * .9))); }` },
    { name: 'uX', ppi: 300, frag: 'void main(){ vec2 s = sheetP(); vec3 c = coatF(s,4); fragColor = vec4(c, fbm(s * 26.)); }' }
  ],
  frag: `
uniform sampler2D uG; uniform sampler2D uE; uniform sampler2D uR; uniform sampler2D uX; uniform sampler2D uP;
const vec3 COL[5] = vec3[5](vec3(.84, .8, .71), vec3(.42, .17, .15), vec3(.33, .56, .54), vec3(.73, .57, .31), vec3(.16, .27, .53));
const float RCH[5] = float[5](.05, .12, .21, .31, .43);
const vec2 TM[5] = vec2[5](vec2(6.6, 12.6), vec2(5.4, 12.), vec2(3.9, 11.2), vec2(2.4, 10.4), vec2(.7, 9.6));
const vec2 LD = vec2(-.6, -.8);
vec4 REACH;  float REACH4;
const float LIP = .05;
/* the stack at s: the top coat still holding (-1 is bare paper) and how far its flake is lifting */
float stack(vec2 s, out float lift){
  vec2 u = winUV(s);
  vec4 g = texture(uG, u) - REACH; float g4 = texture(uX, u).x - REACH4;
  float top = -1.; lift = 0.;
  if (g.x > 0.) { top = 0.; lift = g.x;
    if (g.y > 0.) { top = 1.; lift = g.y;
      if (g.z > 0.) { top = 2.; lift = g.z;
        if (g.w > 0.) { top = 3.; lift = g.w;
          if (g4 > 0.) { top = 4.; lift = g4; } } } } }
  lift = clamp(1. - lift / LIP, 0., 1.);
  return top;
}
float stackS(vec2 s){ float l; return stack(s, l); }
vec3 paintC(vec2 s, int k, float r, float chalk){
  vec3 col = COL[k];
  float fk = float(k);
  float br = gn(rot(.12 + fk * .7) * s * vec2(5., 46.) + fk * 3.);
  col *= .93 + .12 * br;
  col = mix(col, vec3(.92, .9, .86), smoothstep(.55, .85, chalk) * .12);
  col *= 1. - .07 * smoothstep(.5, .8, fbm3(s * 3.3 + fk * 2.)) * (4. - fk) / 4.;
  col *= 1. - .05 * (toothB(s) - .5);
  // each coat weathered on its own: mottled hue, a little sun bleaching up top, grime that rain carried down the wall
  vec4 P = texture(uP, winUV(s));
  col *= 1. + (vec3(P.y, 1. - P.y, P.y * .5 + .25) - .5) * .08;
  col = mix(col, vec3(dot(col, vec3(.33))), .1 + .12 * smoothstep(3.2, .3, s.y - WIN.y) * (fk / 4.));
  col *= 1. - smoothstep(.35, .7, P.w) * .1 * (.5 + .5 * fk / 4.);
  col *= 1. - smoothstep(.45, .85, P.z) * .09;
  // the brush: long laps of the roller and the brush on the top coats
  float lap = gn(vec2(s.x * 2.4 + fk, s.y * .35)) - .5;
  col *= 1. + lap * .07 * step(2.5, fk);
  float hair = gn(rot(-.05) * s * vec2(1.4, 120.) + fk * 7.);
  col *= 1. - smoothstep(.62, .9, hair) * .05;
  float pore = smoothstep(.86, .95, gn(s * 210. + fk * 31.));
  col *= 1. - pore * .16;
  col *= .96 + .08 * r;
  return col;
}
void main(){
  vec2 s = sheetP(), u = winUV(s);
  float t = uT;
  for (int k = 0; k < 4; k++) REACH[k] = mix(-.62, RCH[k], ease(win(t, TM[k].x, TM[k].y)));
  REACH4 = mix(-.52, RCH[4], ease(win(t, TM[4].x, TM[4].y)));
  vec4 fr = frameTex(s);
  // the sheet underneath: the printed frame and the lockup, as they were
  vec3 base = paperB(s);
  base = mix(base, vec3(.106, .102, .094), max(max(fr.r, fr.g), fr.b) * .92);
  float to = toothB(s);
  vec3 ink = vec3(.105, .1, .093) * (.93 + .14 * to);
  float ia = markTex(s).g;
  base = mix(base, ink, ia * .97);
  float lift0; float top = stack(s, lift0);
  float plaster = texture(uP, u).x;
  vec3 col = base;
  vec4 X = texture(uX, u);
  if (top < 0.) {
    // a ghost of the first coats stained into the paper, none on the ink
    float st = (fbm3(s * 9.) - .4) * (1. - ia) * .9;
    vec3 tint = mix(COL[0], COL[1], step(.62, fbm3(s * 2.5 + 3.)));
    col = mix(col, col * mix(vec3(1.), tint * 1.1, .14), clamp(st, 0., 1.));
    // and on the ink, a fine bloom of old bone where the paint was keyed in
    col = mix(col, COL[0], ia * smoothstep(.62, .8, fbm(s * 40.)) * .25);
  } else {
    int k = int(top);
    vec4 E4 = texture(uE, u), R4 = texture(uR, u);
    float e = k == 4 ? X.y : E4[k], r = k == 4 ? X.z : R4[k];
    col = paintC(s, k, r, X.w);
    col *= 1. + lift0 * .09;
    // craquelure: the cracks open a little everywhere as the years pass, wide and dark where a flake is lifting
    float age = .22 + .3 * win(t, 0., 9.);
    float crack = smoothstep(.0011 + lift0 * .003, .0, e) * (age + .78 * smoothstep(.0, .5, lift0));
    col *= 1. - crack * .62;
    // a lifting flake catches the light along its rim
    col = mix(col, vec3(.97, .95, .92), smoothstep(.006, .0015, e) * smoothstep(.0011, .0025, e) * lift0 * .35);
  }
  // relief: thicker stacks toward the light cast a short shadow; edges that drop away from it show a pale chipped rim
  vec2 l = normalize(LD);
  float liftL; float topL = stack(s + l * .006, liftL);
  float topF = stackS(s + l * .014);
  float topS = stackS(s - l * .0035);
  float shadow = min(max(topL - top, 0.), 2.) * .15 + liftL * step(top + .5, topL) * .2 + step(top + .5, topF) * .07;
  col *= 1. - shadow;
  // the wall under it all is hand troweled plaster: every coat follows its relief
  col *= 1. + plaster * (top < 0. ? .5 : 1.);
  float rim = step(topS + .5, top) * (.1 + .05 * min(top - topS, 3.));
  col = mix(col, vec3(.96, .94, .9), rim * .6);
  fragColor = vec4(col, 1.);
}`
};

</script>
<script>
/* motion core: the sidebar stage, the lockup as a distance field, the frame, a WebGL2 canvas and the clock */
(function () {
  const S = window.STUDY;
  const WIN = { x: 32.3, y: 0.1, w: 3.5, h: 5.25 };                 // the stage, in sheet inches
  const TBX = 32.5, TXL = TBX + 0.3, TXR = 35.5 - 0.22, LK = (TXR - TXL) / 346;
  const L = { x: TXL - 6 * LK, y: 0.74, w: 357 * LK, h: 520 * LK };  // the lockup, as on v2
  const stage = document.getElementById('stage'), cap = document.getElementById('cap'), cv = document.getElementById('cv');
  const dateEl = document.getElementById('date'), replayBtn = document.getElementById('replay');
  const q = new URLSearchParams(location.search);
  const FIX = q.has('t') ? parseFloat(q.get('t')) : null;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MARKS = '../../../../marks/';

  /* ---------------------------------------------------------------- layout */
  let W = 0, H = 0, PX = 0;
  function layout() {
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    let h = Math.min(vh - 118, (vw - 32) * 1.5, 760);
    h = Math.max(h, 270);
    const w = Math.round(h / 1.5); h = Math.round(w * 1.5);
    stage.style.width = w + 'px'; stage.style.height = h + 'px'; cap.style.width = w + 'px';
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cap2 = (S.maxPixels || 1.15e6);
    if (w * h * dpr * dpr > cap2) dpr = Math.sqrt(cap2 / (w * h));
    W = Math.round(w * dpr); H = Math.round(h * dpr);
    cv.width = W; cv.height = H; PX = WIN.w / W;
  }

  /* ---------------------------------------------------------------- helpers */
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const fontsReady = (list, ms) => Promise.race([
    Promise.all(list.map(f => document.fonts ? document.fonts.load(f).catch(() => 0) : 0)),
    new Promise(r => setTimeout(r, ms))
  ]);
  // 1D squared distance transform (Felzenszwalb and Huttenlocher)
  function edt1(f, n, d, v, z) {
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q2 = 1; q2 < n; q2++) {
      let s;
      do { const r = v[k]; s = ((f[q2] + q2 * q2) - (f[r] + r * r)) / (2 * q2 - 2 * r); if (s <= z[k]) k--; else break; } while (k >= 0);
      k++; v[k] = q2; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q2 = 0; q2 < n; q2++) { while (z[k + 1] < q2) k++; const r = v[k]; d[q2] = (q2 - r) * (q2 - r) + f[r]; }
  }
  function edt(grid, w, h) {
    const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
    for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = grid[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
    for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = grid[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) grid[y * w + x] = d[x]; }
  }

  /* the lockup as a signed distance field in inches (R), its alpha (G), a study channel (B), the name mask (A) */
  function markField(img) {
    const MW = 714, MH = 1040, c = document.createElement('canvas'); c.width = MW; c.height = MH;
    const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, MW, MH);
    const a = x.getImageData(0, 0, MW, MH).data, N = MW * MH, al = new Float32Array(N);
    for (let i = 0; i < N; i++) al[i] = a[i * 4 + 3] / 255;
    const INF = 1e12, gin = new Float64Array(N), gout = new Float64Array(N);
    for (let i = 0; i < N; i++) { const ins = al[i] >= 0.5; gout[i] = ins ? 0 : INF; gin[i] = ins ? INF : 0; }
    edt(gout, MW, MH); edt(gin, MW, MH);
    const ipx = L.w / MW, out = new Float32Array(N * 4);
    const extra = S.markExtra ? S.markExtra(al, MW, MH, L) : null;
    for (let i = 0; i < N; i++) {
      let dpx = al[i] >= 0.5 ? -(Math.sqrt(gin[i]) - 0.5) : Math.sqrt(gout[i]) - 0.5;
      if (Math.abs(dpx) < 1.2) dpx = (0.5 - al[i]) * 1.1;       // the alpha knows the edge better than the grid
      out[i * 4] = dpx * ipx; out[i * 4 + 1] = al[i]; out[i * 4 + 2] = extra ? extra[i] : 0;
      out[i * 4 + 3] = (Math.floor(i / MW) > 460 * 2) ? 1 : 0;
    }
    return { w: MW, h: MH, data: out };
  }

  /* the frame: the border with the concave corner (R), the vertical rule (G), ruler ticks and numbers (B) */
  function frameCanvas() {
    const ppi = 220, c = document.createElement('canvas'); c.width = Math.round(WIN.w * ppi); c.height = Math.round(WIN.h * ppi);
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    x.setTransform(ppi, 0, 0, ppi, -WIN.x * ppi, -WIN.y * ppi);
    const GAP = 0.3, ENV = py => 53.38 + 0.0741 * py + 0.001358 * py * py, CUT = py => [L.x + ENV(py) * LK + GAP, L.y + py * LK];
    let a = (0.5 - L.y) / LK, b = a; while (CUT(b)[0] < 35.5 && b < 700) b += 0.25;
    const V1 = CUT(a), V2 = [35.5, CUT(b)[1]], R = 0.34, pts = [];
    for (let py = a; py <= b; py += 2) pts.push(CUT(py)); pts.push(CUT(b));
    const sIn = pts.findIndex(p => Math.hypot(p[0] - V1[0], p[1] - V1[1]) >= R);
    let sOut = pts.length - 1; while (sOut > 0 && Math.hypot(pts[sOut][0] - V2[0], pts[sOut][1] - V2[1]) < R) sOut--;
    x.lineJoin = 'round'; x.lineCap = 'round';
    x.strokeStyle = '#f00'; x.lineWidth = 0.0125; x.beginPath();
    x.moveTo(31, 0.5); x.lineTo(V1[0] - R, 0.5); x.quadraticCurveTo(V1[0], 0.5, pts[sIn][0], pts[sIn][1]);
    for (let i = sIn; i <= sOut; i++) x.lineTo(pts[i][0], pts[i][1]);
    x.quadraticCurveTo(35.5, V2[1], 35.5, V2[1] + R); x.lineTo(35.5, 9); x.stroke();
    x.strokeStyle = '#0f0'; x.lineWidth = 0.01; x.beginPath(); x.moveTo(TBX, 0.5); x.lineTo(TBX, 9); x.stroke();
    // ruler: the inch marks that land on this stage (33 along the top, 5 down the right), numbered in Tenor Sans
    x.strokeStyle = 'rgba(0,0,255,.5)'; x.lineWidth = 0.009; x.beginPath();
    x.moveTo(33, 0.5 - 0.12); x.lineTo(33, 0.5); x.moveTo(35.5, 5); x.lineTo(35.5 + 0.12, 5); x.stroke();
    x.fillStyle = 'rgba(0,0,255,.62)'; x.font = '0.12px "Tenor Sans", "Gill Sans", Optima, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('33', 33, 0.16); x.fillText('5', 35.74, 5.14);
    return c;
  }

  /* ---------------------------------------------------------------- GL */
  const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const COMMON = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform vec2 uRes; uniform float uT; uniform float uPx; uniform float uDur;
uniform sampler2D uMark; uniform sampler2D uFrame; uniform sampler2D uPaperT;
in vec2 vUv; out vec4 fragColor;
const vec4 WIN = vec4(${WIN.x}, ${WIN.y}, ${WIN.w}, ${WIN.h});
const vec4 LCK = vec4(${L.x.toFixed(5)}, ${L.y}, ${L.w.toFixed(5)}, ${L.h.toFixed(5)});
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

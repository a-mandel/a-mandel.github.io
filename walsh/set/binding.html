<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Binding studies</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Tenor+Sans&display=swap">
<style>
:root{--ink:#1b1a18;--muted:#8a867e;--paper:#faf9f6;--line:#dcd8cf;--accent:#c07a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:'Tenor Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow-x:hidden}
h1{margin:6px 0 4px;font-weight:400;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.sub{margin:0 0 14px;font:italic 400 16px/1.3 'EB Garamond',Georgia,serif;color:var(--muted);text-align:center}
#stack{position:relative;width:min(88vw,330px);aspect-ratio:330/500;margin:4px 0 0;touch-action:none}
.card{position:absolute;inset:0;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 18px 40px -22px rgba(27,26,24,.35);display:flex;flex-direction:column;align-items:center;padding:22px 18px 18px;
  transition:transform .45s cubic-bezier(.3,1.2,.4,1),opacity .35s ease;will-change:transform;user-select:none;-webkit-user-select:none}
.card.drag{transition:none;cursor:grabbing}
.card canvas{width:100%;height:auto;display:block;pointer-events:none;margin-bottom:14px;border-radius:6px}
.card .n{margin-top:auto;font-size:10px;letter-spacing:.3em;color:var(--muted)}
.card h2{margin:6px 0 4px;font-weight:400;font-size:15px;letter-spacing:.26em;text-transform:uppercase;text-align:center}
.card p{margin:0;font:italic 400 15px/1.3 'EB Garamond',Georgia,serif;color:#4a4742;text-align:center;max-width:24ch}
.card .bar{display:none;width:60%;height:2px;background:var(--line);margin-top:12px;border-radius:2px;overflow:hidden}
.card .bar i{display:block;height:100%;width:0;background:var(--ink)}
.stamp{position:absolute;top:18px;padding:5px 10px;border:1.5px solid;border-radius:6px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:0;pointer-events:none}
.stamp.k{right:16px;color:#2f6b3a;transform:rotate(8deg)}
.stamp.p{left:16px;color:#a33;transform:rotate(-8deg)}
.btns{display:flex;gap:14px;margin-top:20px;align-items:center}
.btns button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:400 11px/1 'Tenor Sans',sans-serif;letter-spacing:.28em;text-transform:uppercase;border-radius:999px;padding:13px 20px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.btns button:hover{border-color:var(--ink)}
.btns .keep{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{margin-top:12px;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
#done{display:none;width:min(92vw,420px);text-align:center;margin-top:18px}
#done h2{font-weight:400;font-size:13px;letter-spacing:.3em;text-transform:uppercase;margin:6px 0 14px}
#done ul{list-style:none;margin:0 0 16px;padding:0}
#done li{display:flex;gap:12px;align-items:center;justify-content:center;padding:9px 0;border-bottom:1px solid var(--line);font:italic 400 18px/1.2 'EB Garamond',Georgia,serif}
#done li b{font:400 11px/1 'Tenor Sans',sans-serif;letter-spacing:.3em;color:var(--muted)}
#done .none{border:0;color:var(--muted)}
#done .btns{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:11px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<h1>Binding studies</h1>
<p class="sub">Ten ways to bind the set. Swipe right to keep, left to pass.</p>
<div id="stack" aria-live="polite"></div>
<div class="btns" id="btns"><button type="button" id="pass">Pass</button><button type="button" class="keep" id="keep">Keep</button></div>
<div class="hint" id="hint">Arrow keys work too</div>
<div id="done"><h2>Your keepers</h2><ul id="list"></ul><div class="btns"><button type="button" id="copy">Copy list</button><button type="button" id="again">Start over</button></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
const W = 600, H = 600;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
let sd = 5; const rnd = () => (sd = sd * 16807 % 2147483647) / 2147483647;
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
/* noise texture helper: speckle over a rect */
function grain(g, x, y, w, h, n, col, a, s = 1.2) { g.save(); g.fillStyle = col; for (let i = 0; i < n; i++) { g.globalAlpha = a * rnd(); g.fillRect(x + rnd() * w, y + rnd() * h, s * (0.5 + rnd()), s * (0.5 + rnd())); } g.restore(); }
function weave(g, x, y, w, h, col, a) { g.save(); g.strokeStyle = col; g.lineWidth = 1; g.globalAlpha = a; for (let k = 0; k < h; k += 2.2) { g.beginPath(); g.moveTo(x, y + k); g.lineTo(x + w, y + k + (rnd() - .5)); g.stroke(); } for (let k = 0; k < w; k += 2.6) { g.globalAlpha = a * .6; g.beginPath(); g.moveTo(x + k, y); g.lineTo(x + k, y + h); g.stroke(); } g.restore(); }
/* the sheet: weathered paper, border, a few hairlines of drawing, title block edge */
function sheet(g, BX) {
  g.fillStyle = '#e9e7e2'; g.fillRect(0, 0, W, H);
  g.save(); g.shadowColor = 'rgba(0,0,0,.22)'; g.shadowBlur = 22; g.shadowOffsetY = 8; g.fillStyle = '#f4f1ea'; g.fillRect(14, 40, W - 28, H - 80); g.restore();
  grain(g, 14, 40, W - 28, H - 80, 2600, '#8a7f6a', .12, 1.4);
  g.strokeStyle = '#1b1a18'; g.lineWidth = 1.1; g.beginPath(); g.roundRect(BX + 22, 62, W - BX - 58, H - 124, 8); g.stroke();
  g.lineWidth = .7; g.globalAlpha = .55;
  for (let k = 0; k < 9; k++) { g.beginPath(); const y = 150 + k * 32 + rnd() * 6; g.moveTo(BX + 70 + rnd() * 30, y); g.lineTo(BX + 300 + rnd() * 80, y - 20 + rnd() * 40); g.stroke(); }
  g.beginPath(); g.moveTo(BX + 120, 420); g.lineTo(BX + 210, 230); g.lineTo(BX + 330, 300); g.lineTo(BX + 380, 420); g.stroke();
  g.globalAlpha = 1; g.font = '17px "Tenor Sans"'; g.fillStyle = '#1b1a18'; g.fillText('W A L S H   R E S I D E N C E', BX + 42, 98);
}
function rivet(g, x, y, r, metal) {
  const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  const m = { steel: ['#f3f3f1', '#9a9a96', '#3d3d3b'], brass: ['#fff1c4', '#c8a050', '#5e4517'], black: ['#7a7a76', '#2a2a28', '#0b0b0a'], silver: ['#ffffff', '#c4c6c8', '#55585b'] }[metal];
  gr.addColorStop(0, m[0]); gr.addColorStop(.55, m[1]); gr.addColorStop(1, m[2]);
  g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 4; g.shadowOffsetY = 1.5; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function bar(g, x, y, w, h, fill, rad = 2) { g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 10; g.shadowOffsetX = 3; g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, rad); g.fill(); g.restore(); }
const Y0 = 40, BH = H - 80, ys = n => Array.from({ length: n }, (_, i) => Y0 + BH * (i + 1) / (n + 1));
const OPTS = [
  { name: 'Black cloth, three rivets', note: 'Today’s binding. Textured black tape, steel rivets.', draw: g => { sheet(g, 64); bar(g, 14, Y0, 64, BH, '#1c1b19', 1); weave(g, 14, Y0, 64, BH, '#3a3934', .35); ys(3).forEach(y => rivet(g, 46, y, 6, 'steel')); } },
  { name: 'Black cloth, brass screws', note: 'Same tape, two Chicago screws in brass. A little warmer.', draw: g => { sheet(g, 64); bar(g, 14, Y0, 64, BH, '#1c1b19', 1); weave(g, 14, Y0, 64, BH, '#3a3934', .35); ys(2).forEach(y => { rivet(g, 46, y, 9, 'brass'); g.strokeStyle = 'rgba(60,40,10,.7)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(40, y); g.lineTo(52, y); g.stroke(); }); } },
  { name: 'Walnut clamp bar', note: 'A solid walnut bar over the edge, two brass bolts. Furniture grade.', draw: g => { sheet(g, 70); const gr = g.createLinearGradient(14, 0, 84, 0); gr.addColorStop(0, '#3a2414'); gr.addColorStop(.5, '#5b3a22'); gr.addColorStop(1, '#3e2716'); bar(g, 12, Y0 - 6, 72, BH + 12, gr, 4); g.save(); g.strokeStyle = '#2a170b'; g.globalAlpha = .45; for (let k = 0; k < 26; k++) { g.lineWidth = .6 + rnd(); g.beginPath(); const x = 16 + rnd() * 64; g.moveTo(x, Y0); g.bezierCurveTo(x + rnd() * 8 - 4, H * .3, x + rnd() * 8 - 4, H * .6, x + rnd() * 6 - 3, Y0 + BH); g.stroke(); } g.restore(); ys(2).forEach(y => rivet(g, 48, y, 8, 'brass')); } },
  { name: 'Blackened steel bar', note: 'A flat steel strap with hex bolts. Industrial, heavy, very Tahoe.', draw: g => { sheet(g, 60); const gr = g.createLinearGradient(14, 0, 74, 0); gr.addColorStop(0, '#2b2c2d'); gr.addColorStop(.45, '#4a4c4e'); gr.addColorStop(1, '#232425'); bar(g, 14, Y0 - 4, 58, BH + 8, gr, 1); grain(g, 14, Y0, 58, BH, 1400, '#9aa0a4', .25, 1); ys(3).forEach(y => { g.save(); g.fillStyle = '#18191a'; g.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + .3; g.lineTo(43 + Math.cos(a) * 9, y + Math.sin(a) * 9); } g.closePath(); g.fill(); g.restore(); rivet(g, 43, y, 4, 'black'); }); } },
  { name: 'Natural linen, stitched', note: 'Oat linen book cloth with one line of black stitching. Soft and crafted.', draw: g => { sheet(g, 64); bar(g, 14, Y0, 64, BH, '#cfc5b1', 1); weave(g, 14, Y0, 64, BH, '#8f846d', .3); g.save(); g.strokeStyle = '#1b1a18'; g.lineWidth = 1.8; g.setLineDash([9, 6]); g.beginPath(); g.moveTo(58, Y0 + 10); g.lineTo(58, Y0 + BH - 10); g.stroke(); g.restore(); } },
  { name: 'Japanese stab binding', note: 'Four hole yotsume toji in black thread on the paper itself. No tape.', draw: g => { sheet(g, 46); const hs = ys(4), x = 38; g.save(); g.strokeStyle = '#141412'; g.lineWidth = 2.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, hs[0] - 30); g.lineTo(x, hs[3] + 30); g.stroke(); hs.forEach(y => { g.beginPath(); g.moveTo(14, y); g.lineTo(x, y); g.stroke(); }); g.beginPath(); g.moveTo(x, hs[0] - 30); g.lineTo(14, hs[0] - 30); g.moveTo(x, hs[3] + 30); g.lineTo(14, hs[3] + 30); g.stroke(); g.restore(); hs.forEach(y => { g.fillStyle = '#0d0d0c'; g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); }); } },
  { name: 'Black twin loop wire', note: 'Matte black wire coils. Lies flat, flips all the way around.', draw: g => { sheet(g, 50); g.save(); for (let y = Y0 + 10; y < Y0 + BH - 6; y += 13) { g.fillStyle = '#e9e7e2'; g.beginPath(); g.arc(46, y + 3, 3.4, 0, 7); g.fill(); g.strokeStyle = '#151514'; g.lineWidth = 3; g.beginPath(); g.ellipse(32, y, 16, 6, -.15, Math.PI * .55, Math.PI * 2.35); g.stroke(); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = .8; g.beginPath(); g.ellipse(32, y - 1, 15, 5, -.15, Math.PI * 1.1, Math.PI * 1.5); g.stroke(); } g.restore(); } },
  { name: 'Kraft tape, steel rivets', note: 'Brown kraft paper tape, steel rivets. The model shop look.', draw: g => { sheet(g, 64); bar(g, 14, Y0, 64, BH, '#a9875c', 1); grain(g, 14, Y0, 64, BH, 2200, '#5c4326', .22, 1.6); ys(3).forEach(y => rivet(g, 46, y, 6, 'steel')); } },
  { name: 'Cognac leather, saddle stitch', note: 'Vegetable tanned leather strap, white saddle stitch, brass rivets.', draw: g => { sheet(g, 66); const gr = g.createLinearGradient(14, 0, 80, 0); gr.addColorStop(0, '#6b3a1a'); gr.addColorStop(.5, '#9a5a2a'); gr.addColorStop(1, '#6e3c1c'); bar(g, 14, Y0, 66, BH, gr, 3); grain(g, 14, Y0, 66, BH, 1500, '#3a1d0a', .25, 1.4); g.save(); g.strokeStyle = '#f1e7d4'; g.lineWidth = 1.6; g.setLineDash([6, 5]); [22, 72].forEach(x => { g.beginPath(); g.moveTo(x, Y0 + 8); g.lineTo(x, Y0 + BH - 8); g.stroke(); }); g.restore(); ys(2).forEach(y => rivet(g, 47, y, 6, 'brass')); } },
  { name: 'Clear acrylic bar', note: 'A clear bar with silver posts. The drawing runs right to the edge.', draw: g => { sheet(g, 40); g.save(); g.fillStyle = 'rgba(215,230,235,.38)'; g.strokeStyle = 'rgba(120,150,160,.6)'; g.lineWidth = 1; g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 8; g.shadowOffsetX = 2; g.beginPath(); g.roundRect(14, Y0 - 4, 58, BH + 8, 3); g.fill(); g.stroke(); g.restore(); g.save(); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(22, Y0 + 6); g.lineTo(22, Y0 + BH - 6); g.stroke(); g.restore(); ys(3).forEach(y => rivet(g, 43, y, 6, 'silver')); } }
];
const stack = document.getElementById('stack'), hint = document.getElementById('hint'), btns = document.getElementById('btns'), done = document.getElementById('done'), list = document.getElementById('list');
let keep = [];
function build(i, total) {
  const o = OPTS[i], c = document.createElement('div'); c.className = 'card'; c._i = i;
  const cv = mk(); sd = 5 + i * 31; o.draw(cv.getContext('2d'));
  c.innerHTML = '<span class="stamp k">Keep</span><span class="stamp p">Pass</span>'; c.appendChild(cv);
  const h = document.createElement('h2'); h.textContent = o.name; c.appendChild(h);
  const p = document.createElement('p'); p.textContent = o.note; c.appendChild(p);
  const n = document.createElement('div'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0'); c.appendChild(n);
  bindDrag(c); return c;
}
function layout() {
  [...stack.children].forEach((c, k, a) => { const d = a.length - 1 - k; c.style.zIndex = k; c.style.transform = d ? `translateY(${d * 10}px) scale(${1 - d * .04})` : 'none'; c.style.opacity = d > 2 ? 0 : 1; c.style.pointerEvents = d ? 'none' : 'auto'; });
  if (!stack.lastElementChild) finish();
}
function fling(card, dir) {
  if (card._gone) return; card._gone = true; if (dir > 0) keep.push(card._i);
  card.classList.remove('drag'); card.style.transform = `translateX(${dir * 520}px) rotate(${dir * 22}deg)`; card.style.opacity = 0;
  setTimeout(() => { card.remove(); layout(); }, 360);
}
function bindDrag(c) {
  let x0 = 0, dx = 0, on = false; const kk = c.querySelector('.stamp.k'), pp = c.querySelector('.stamp.p');
  c.addEventListener('pointerdown', e => { if (c !== stack.lastElementChild) return; on = true; x0 = e.clientX; dx = 0; c.classList.add('drag'); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!on) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; kk.style.opacity = clamp(dx / 90); pp.style.opacity = clamp(-dx / 90); });
  const end = () => { if (!on) return; on = false; c.classList.remove('drag'); kk.style.opacity = pp.style.opacity = 0; if (Math.abs(dx) > 90) fling(c, dx > 0 ? 1 : -1); else c.style.transform = 'none'; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function start() { stack.innerHTML = ''; keep = []; done.style.display = 'none'; btns.style.display = 'flex'; hint.style.display = 'block'; stack.style.display = 'block'; for (let k = OPTS.length - 1; k >= 0; k--) stack.appendChild(build(k, OPTS.length)); layout(); }
function finish() { stack.style.display = 'none'; btns.style.display = 'none'; hint.style.display = 'none'; done.style.display = 'block';
  list.innerHTML = keep.length ? keep.sort((a, b) => a - b).map(i => `<li><b>${String(i + 1).padStart(2, '0')}</b>${OPTS[i].name}</li>`).join('') : '<li class="none">No keepers. Start over?</li>'; }
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };
document.getElementById('pass').onclick = () => { const c = stack.lastElementChild; c && fling(c, -1); };
document.getElementById('keep').onclick = () => { const c = stack.lastElementChild; c && fling(c, 1); };
document.getElementById('again').onclick = start;
document.getElementById('copy').onclick = () => { const txt = keep.length ? keep.map(i => (i + 1) + ' ' + OPTS[i].name).join(', ') : 'none'; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied'), () => toast(txt)); };
addEventListener('keydown', e => { const c = stack.lastElementChild; if (!c || done.style.display === 'block') return; if (e.key === 'ArrowRight') fling(c, 1); else if (e.key === 'ArrowLeft') fling(c, -1); });
(document.fonts ? document.fonts.load('17px "Tenor Sans"') : Promise.resolve()).then(start, start);
})();
</script>
</body>
</html>
